<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#121010">
<title>skillquiver.dev</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --carbon:#121010; --red:#D43B2A; --gold:#FFB400; --dark:#333130;
  --ash:#F2F0EE; --white:#FFFFFF; --echo:#878E88; --soft:#E5E3E0;
  --sans:'Outfit',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  --max:1160px; --pad:clamp(20px,5vw,48px);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--carbon);color:var(--ash);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--pad);width:100%}
.wm{font-size:1.05rem;letter-spacing:-0.01em;white-space:nowrap;font-weight:400;color:var(--white)}
.wm b{font-weight:700;text-transform:uppercase;letter-spacing:0.1em}
.wm span{color:var(--red)}
h1{font-size:clamp(1.9rem,5vw,3.2rem);line-height:1.1;font-weight:700;letter-spacing:-0.03em;color:var(--white);margin:26px 0 0;max-width:16ch}
.rule{width:56px;height:3px;background:var(--red);margin-top:30px}
</style>
</head>
<body>
<div class="wrap">
  <span class="wm">full<span>/</span><b>REFIT</b></span>
  <h1>skillquiver.dev &mdash; coming soon</h1>
  <div class="rule"></div>
</div>
</body>
</html>
